services:
  # AmaLLgaM and friends
  amallgam_1:
    build: amallgam_server
    develop:
      watch:
        - action: rebuild
          path: ./amallgam_server
    environment:
      RUST_LOG: info,activitypub_federation=debug,tower_http=trace
      AMALLGAM_ROOT: "/amallgam"
      AMALLGAM_DOMAIN: "amallgam_1.docker"
      AMALLGAM_MAX_SIMULTANEOUS_SESSIONS: "1"
      AMALLGAM_NUM_CORES_PER_SESSION: "2"
    volumes:
      - "./volumes/amallgam_1/data:/amallgam/data:Z"
      - "./extra/amallgam/models:/amallgam/models:z"
      - "./extra/ssl/amallgam_1:/amallgam/ssl:z"
      - "./extra/ssl/ca/cert.pem:/etc/ssl/certs/ca.pem:z"
    networks:
      default:
        aliases:
          - amallgam_1.docker

  amallgam_2:
    build: amallgam_server
    develop:
      watch:
        - action: rebuild
          path: ./amallgam_server
    environment:
      RUST_LOG: info,activitypub_federation=debug,tower_http=trace
      AMALLGAM_ROOT: "/amallgam"
      AMALLGAM_DOMAIN: "amallgam_2.docker"
      AMALLGAM_MAX_SIMULTANEOUS_SESSIONS: "1"
      AMALLGAM_NUM_CORES_PER_SESSION: "2"
    volumes:
      - "./volumes/amallgam_2/data:/amallgam/data:Z"
      - "./extra/amallgam/models:/amallgam/models:z"
      - "./extra/ssl/amallgam_2:/amallgam/ssl:z"
      - "./extra/ssl/ca/cert.pem:/etc/ssl/certs/ca.pem:z"
    networks:
      default:
        aliases:
          - amallgam_2.docker

  # Mastodon and friends
  mastodon:
    build: vendor/mastodon
    env_file:
      - "./vendor/mastodon/.env"
    environment:
      PUID: 1000
      PGID: 1000
      LOCAL_DOMAIN: mastodon.docker
      REDIS_HOST: mastodon_redis
      REDIS_PORT: 6379
      DB_HOST: mastodon_postgres
      DB_PORT: 5432
      DB_USER: mastodon
      DB_NAME: mastodon
      DB_PASS: mastodon
      ES_ENABLED: false
      SMTP_SERVER: smtp4dev
      SMTP_PORT: 25
      SMTP_LOGIN: mastodon
      SMTP_PASSWORD: mastodon
      SMTP_FROM_ADDRESS: notifications@smtp4dev
      S3_ENABLED: false
      ALLOWED_PRIVATE_ADDRESSES: "172.0.0.1/8"
    volumes:
      - "./volumes/mastodon/config:/config:Z"
      - "./extra/ssl/mastodon:/config/keys:z"
      - "./extra/ssl/ca/cert.pem:/etc/ssl/certs/ca.pem:z"
    networks:
      default:
        aliases:
          - mastodon.docker

  mastodon_redis:
    image: redis:alpine
    volumes:
      - "./volumes/mastodon/redis/data:/data:Z"

  mastodon_postgres:
    image: postgres:alpine
    environment:
      POSTGRES_USER: mastodon
      POSTGRES_DB: mastodon
      POSTGRES_PASSWORD: mastodon
    volumes:
      - "./volumes/mastodon/postgres/data:/var/lib/postgresql/data:Z"

  # Dummy SMTP server
  smtp4dev:
    image: rnwood/smtp4dev:v3
    volumes:
      - "./volumes/smtp4dev/data:/smtp4dev:Z"
    environment:
      - ServerOptions__Urls=http://*:80
